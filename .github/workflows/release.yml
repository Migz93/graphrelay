name: Release Docker Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg COMMIT_SHA="$GITHUB_SHA" -t "ghcr.io/migz93/graphrelay:$GITHUB_REF_NAME" -t ghcr.io/migz93/graphrelay:latest .
      - env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/migz93/graphrelay:$GITHUB_REF_NAME"
          docker push ghcr.io/migz93/graphrelay:latest
