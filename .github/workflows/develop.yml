name: Develop Docker Publish
on:
  push:
    branches: [develop]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg COMMIT_SHA="$GITHUB_SHA" -t ghcr.io/migz93/graphrelay:develop .
      - env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/migz93/graphrelay:develop
